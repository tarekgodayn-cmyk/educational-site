<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحاسب الآلي والتكنولوجيا التفاعلية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .result { margin-top: 15px; padding: 10px; background: #eef9f1; border-right: 4px solid #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>المنصة التعليمية التفاعلية</h1>

    <!-- محاكي الأنظمة العددية -->
    <div class="card">
        <h2>محاكي الأنظمة العددية (الوحدة 6)</h2>
        <label for="decInput">أدخل رقماً عشرياً (Decimal):</label>
        <input type="number" id="decInput" placeholder="مثال: 10" oninput="convertNumber()">
        
        <div class="result">
            النظام الثنائي (Binary): <span id="binResult">-</span><br>
            النظام السداسي عشر (Hex): <span id="hexResult">-</span>
        </div>
    </div>

    <!-- محاكي الدوائر المنطقية -->
    <div class="card">
        <h2>محاكي BCD والدوائر المنطقية (الوحدة 7)</h2>
        
        <label for="gateType">اختر البوابة المنطقية:</label>
        <select id="gateType" onchange="calculateLogic()">
            <option value="AND">AND (و)</option>
            <option value="OR">OR (أو)</option>
            <option value="XOR">XOR (أو الحصرية)</option>
        </select>

        <label for="inputA">المدخل الأول (A):</label>
        <select id="inputA" onchange="calculateLogic()">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>

        <label for="inputB">المدخل الثاني (B):</label>
        <select id="inputB" onchange="calculateLogic()">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>

        <div class="result">
            المخرج (Output): <span id="logicResult">0</span>
        </div>
    </div>
</div>

<script>
    function convertNumber() {
        const val = document.getElementById('decInput').value;
        if (val === '') {
            document.getElementById('binResult').innerText = '-';
            document.getElementById('hexResult').innerText = '-';
            return;
        }
        const num = parseInt(val, 10);
        document.getElementById('binResult').innerText = num.toString(2);
        document.getElementById('hexResult').innerText = num.toString(16).toUpperCase();
    }

    function calculateLogic() {
        const a = parseInt(document.getElementById('inputA').value);
        const b = parseInt(document.getElementById('inputB').value);
        const gate = document.getElementById('gateType').value;
        let res = 0;

        if (gate === 'AND') res = a & b;
        else if (gate === 'OR') res = a | b;
        else if (gate === 'XOR') res = a ^ b;

        document.getElementById('logicResult').innerText = res;
    }
</script>

</body>
</html>
